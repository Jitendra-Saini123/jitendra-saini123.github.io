<!doctype html><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
const log = (o) => fetch("/log", { method: "POST", body: JSON.stringify(o) });

// Blendshapes the site actually animates; everything else is dropped to save bytes.
const KEEP_MORPHS = new Set(["eyeBlinkLeft", "eyeBlinkRight", "mouthSmileLeft", "mouthSmileRight"]);

// Physically based settings per material (the FBX only carries Phong).
const PBR = {
  AvatarBody: { roughness: 0.62 }, AvatarHead: { roughness: 0.58 },
  AvatarLeftEyeball: { roughness: 0.08 }, AvatarRightEyeball: { roughness: 0.08 },
  AvatarTeethLower: { roughness: 0.35 }, AvatarTeethUpper: { roughness: 0.35 },
  AvatarEyelashes: { roughness: 0.9, color: 0x111111 },
  glasses: { roughness: 0.18, metalness: 0.55 },
  haircut: { roughness: 0.7, alphaTest: 0.45, doubleSided: true },
  outfit_top: { roughness: 0.78 }, outfit_bottom: { roughness: 0.86 }, outfit_shoes: { roughness: 0.55 },
};

try {
  const manager = new THREE.LoadingManager();
  const allLoaded = new Promise((resolve) => (manager.onLoad = resolve));
  const obj = await new FBXLoader(manager).loadAsync("/model.fbx");
  await allLoaded;

  const report = { morphsBefore: 0, morphsAfter: 0, meshes: [] };
  obj.traverse((o) => {
    if (!o.isMesh) return;
    // 1. Phong -> Standard
    const src = o.material;
    const cfg = PBR[src.name] || { roughness: 0.7 };
    const mat = new THREE.MeshStandardMaterial({
      name: src.name, map: src.map || null, normalMap: src.normalMap || null,
      color: cfg.color ?? (src.map ? 0xffffff : src.color.getHex()),
      roughness: cfg.roughness, metalness: cfg.metalness ?? 0,
      alphaTest: cfg.alphaTest ?? 0, side: cfg.doubleSided ? THREE.DoubleSide : THREE.FrontSide,
    });
    if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
    o.material = mat;

    // 2. Prune morph targets
    const g = o.geometry;
    const dict = o.morphTargetDictionary;
    if (g.morphAttributes.position && dict) {
      report.morphsBefore += g.morphAttributes.position.length;
      const names = Object.keys(dict).sort((a, b) => dict[a] - dict[b]);
      const keep = names.map((n, i) => [n, i]).filter(([n]) => KEEP_MORPHS.has(n));
      for (const key of Object.keys(g.morphAttributes)) g.morphAttributes[key] = keep.map(([, i]) => g.morphAttributes[key][i]);
      if (keep.length === 0) { g.morphAttributes = {}; delete o.morphTargetDictionary; delete o.morphTargetInfluences; }
      else {
        o.morphTargetDictionary = Object.fromEntries(keep.map(([n], j) => [n, j]));
        o.morphTargetInfluences = keep.map(() => 0);
      }
      report.morphsAfter += keep.length;
    }
    report.meshes.push({ name: o.name, morphs: o.morphTargetDictionary ? Object.keys(o.morphTargetDictionary) : [] });
  });
  obj.name = "Avatar";

  const glb = await new GLTFExporter().parseAsync(obj, { binary: true, onlyVisible: true, maxTextureSize: 1024 });
  await fetch("/result?name=avatar-raw.glb", { method: "POST", body: glb });
  await log(report);
} catch (e) { await log({ error: String(e), stack: String(e.stack).slice(0, 1200) }); }
await fetch("/done", { method: "POST" });
</script>
